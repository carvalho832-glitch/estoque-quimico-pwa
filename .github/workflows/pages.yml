name: Validar e publicar QuimStock

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  # Chave pública Web Push do Firebase. Não é segredo e pode ficar no build do cliente.
  VITE_FIREBASE_VAPID_KEY: BIqaP9kCd72jHOKyvSUbBRarcIOK0WJp34F0KnRMNcj4BERRpjyAYEH3BSurSrRTjIHhDtaR6MgnEwuvwkiaeCU

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Executar testes
        run: npm test

      - name: Gerar aplicação
        run: npm run build

      - name: Conferir configuração VAPID
        shell: bash
        run: |
          if [ -n "$VITE_FIREBASE_VAPID_KEY" ]; then
            echo "VAPID_CONFIGURED=true"
          else
            echo "::warning::VITE_FIREBASE_VAPID_KEY ainda não está configurada."
            echo "VAPID_CONFIGURED=false"
          fi

      - name: Conferir credencial de deploy Firebase
        shell: bash
        env:
          FIREBASE_DEPLOY_CONFIGURED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIMSTOCK != '' }}
        run: |
          if [ "$FIREBASE_DEPLOY_CONFIGURED" = "true" ]; then
            echo "FIREBASE_DEPLOY_CONFIGURED=true"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_QUIMSTOCK ainda não está configurado nos secrets do repositório."
            echo "FIREBASE_DEPLOY_CONFIGURED=false"
          fi

      - name: Configurar Node.js para Functions
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependências das Functions
        run: npm --prefix functions install --no-audit --no-fund

      - name: Testar backend de notificações
        run: npm --prefix functions test

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Preparar arquivos para publicação
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar aplicação
        id: deployment
        uses: actions/deploy-pages@v5
