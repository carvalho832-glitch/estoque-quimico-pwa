name: Gerar QuimStock Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Preparar aplicativo Android
        run: npm run android:sync

      - name: Compilar APK release sem assinatura
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar APK e ferramentas de assinatura
        run: |
          set -e
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p quimstock-release-tools/lib
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk QuimStock-v1.3.2-unsigned.apk
          cp "$BUILD_TOOLS/apksigner" quimstock-release-tools/apksigner
          cp "$BUILD_TOOLS/zipalign" quimstock-release-tools/zipalign
          cp "$BUILD_TOOLS/lib/apksigner.jar" quimstock-release-tools/lib/apksigner.jar
          chmod +x quimstock-release-tools/apksigner quimstock-release-tools/zipalign

      - name: Disponibilizar release para assinatura
        uses: actions/upload-artifact@v5
        with:
          name: QuimStock-v1.3.2-release
          path: |
            QuimStock-v1.3.2-unsigned.apk
            quimstock-release-tools/
          if-no-files-found: error
