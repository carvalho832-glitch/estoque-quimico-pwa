name: Ajustar E-code e lote compartilhados

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código da branch do pull request
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Ajustar validações
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          old_qr = """  function applyQrData(qr: InventoryQrData, imageName: string) {
    const existing = products.find(
      (product) => product.ecode.toUpperCase() === qr.ecode && product.batch.toUpperCase() === qr.batch,
    );
    const knownProduct = existing ?? products.find((product) => product.ecode.toUpperCase() === qr.ecode);
    const baseDraft = existing ? productToDraft(existing) : draft;
"""
          new_qr = """  function applyQrData(qr: InventoryQrData, imageName: string) {
    const exactMatches = products.filter(
      (product) => product.ecode.toUpperCase() === qr.ecode && product.batch.toUpperCase() === qr.batch,
    );
    const existing = exactMatches.length === 1 ? exactMatches[0] : undefined;
    const knownProduct = existing ?? (exactMatches.length ? undefined : products.find(
      (product) => product.ecode.toUpperCase() === qr.ecode,
    ));
    const baseDraft = existing ? productToDraft(existing) : draft;
"""
          if old_qr not in app:
              raise SystemExit('Trecho applyQrData não encontrado')
          app = app.replace(old_qr, new_qr, 1)

          old_message = """    if (existing) {
      setMessage('QR lido automaticamente. O registro existente foi aberto para atualização. Confira a DV.');
    } else if (qr.expiryDate) {
"""
          new_message = """    if (exactMatches.length > 1) {
      setMessage(`QR lido. Existem ${exactMatches.length} produtos com este Ecode/Material e lote. Informe a descrição correta para cadastrar um novo produto ou abra o registro desejado na lista para atualizar.`);
    } else if (existing) {
      setMessage('QR lido automaticamente. O registro existente foi aberto para atualização. Confira a DV.');
    } else if (qr.expiryDate) {
"""
          if old_message not in app:
              raise SystemExit('Trecho de mensagem do QR não encontrado')
          app = app.replace(old_message, new_message, 1)

          old_duplicate = """    const duplicate = products.find(
      (item) => item.id !== product.id && item.ecode.toUpperCase() === product.ecode && item.batch.toUpperCase() === product.batch,
    );

    if (duplicate) {
      setMessage('Este Ecode/Material e lote já estão cadastrados. Abra o registro existente para atualizar.');
      return;
    }
"""
          new_duplicate = """    const sameCodeAndBatch = products.filter(
      (item) => item.id !== product.id
        && item.ecode.toUpperCase() === product.ecode
        && item.batch.toUpperCase() === product.batch,
    );

    if (sameCodeAndBatch.length && !draft.name.trim()) {
      setMessage('Este Ecode/Material e lote já são usados por outro produto. Informe o nome/descrição para diferenciar o novo material.');
      return;
    }

    const normalizedName = product.name.trim().toLocaleLowerCase('pt-BR');
    const duplicate = sameCodeAndBatch.find(
      (item) => item.name.trim().toLocaleLowerCase('pt-BR') === normalizedName,
    );

    if (duplicate) {
      setMessage('Já existe um produto com o mesmo Ecode/Material, lote e nome. Abra o registro existente para atualizar.');
      return;
    }
"""
          if old_duplicate not in app:
              raise SystemExit('Trecho de duplicidade não encontrado')
          app = app.replace(old_duplicate, new_duplicate, 1)
          app_path.write_text(app, encoding='utf-8')

          inventory_path = Path('src/components/InventorySession.tsx')
          inventory = inventory_path.read_text(encoding='utf-8')
          old_inventory = """      const exactProduct = products.find(
        (product) => normalize(product.ecode) === qr.ecode && normalize(product.batch) === qr.batch,
      );
      const knownProduct = exactProduct ?? products.find((product) => normalize(product.ecode) === qr.ecode);
"""
          new_inventory = """      const exactProducts = products.filter(
        (product) => normalize(product.ecode) === qr.ecode && normalize(product.batch) === qr.batch,
      );

      if (exactProducts.length > 1) {
        setScannerOpen(false);
        setMessage(`Existem ${exactProducts.length} produtos com o E-code ${qr.ecode} e lote ${qr.batch}. Use “Adicionar manualmente” para selecionar a descrição correta.`);
        return;
      }

      const exactProduct = exactProducts[0];
      const knownProduct = exactProduct ?? products.find((product) => normalize(product.ecode) === qr.ecode);
"""
          if old_inventory not in inventory:
              raise SystemExit('Trecho do inventário não encontrado')
          inventory = inventory.replace(old_inventory, new_inventory, 1)
          inventory_path.write_text(inventory, encoding='utf-8')

          sw_path = Path('public/sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          if 'quimstock-v46' not in sw:
              raise SystemExit('Versão esperada do cache não encontrada')
          sw_path.write_text(sw.replace('quimstock-v46', 'quimstock-v47', 1), encoding='utf-8')
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar build
        run: |
          npm install
          npm run build

      - name: Publicar correção na branch
        run: |
          rm .github/workflows/allow-shared-ecode-lot.yml
          rm -f .build-trigger-shared-ecode-lot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Permitir produtos diferentes com mesmo E-code e lote"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
